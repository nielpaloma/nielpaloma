<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ConectaTerra | Login e anúncios reais</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f6f8f6;color:#17311f}
.wrap{max-width:1000px;margin:auto;padding:20px}
header{background:#fff;border-bottom:1px solid #ddd}
nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
button{background:#1f7a45;color:white;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
button.alt{background:white;color:#1f7a45;border:1px solid #ddd}
.card{background:white;border:1px solid #ddd;border-radius:16px;padding:18px;margin:14px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}
textarea{min-height:100px}.full{grid-column:1/-1}.hidden{display:none}.muted{color:#6c7b70}
#auth{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px}
#auth.hidden{display:none}.modal{background:#fff;padding:20px;border-radius:16px;max-width:420px;width:100%}
.listings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid,.listings{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><div class="wrap"><nav>
<h2>🌱 ConectaTerra</h2>
<div>
<span id="status">Visitante</span>
<button class="alt" onclick="openAuth()">Entrar / Criar conta</button>
<button id="logout" class="alt hidden" onclick="logout()">Sair</button>
</div>
</nav></div></header>

<div class="wrap">
<div class="card">
<h1>Terrenos no Brasil</h1>
<p class="muted">Agora conectado ao Supabase para cadastro, login e anúncios reais.</p>
</div>

<div class="card">
<h2>Buscar terrenos</h2>
<div class="grid">
<input id="fEstado" placeholder="Estado">
<input id="fCidade" placeholder="Cidade">
<input id="fBairro" placeholder="Bairro">
<select id="fTipo"><option value="">Todos</option><option>Urbano</option><option>Rural</option><option>Comercial</option><option>Chácara</option><option>Sítio</option><option>Fazenda</option></select>
</div>
<p><button onclick="loadListings()">Buscar</button></p>
<div id="listings" class="listings"></div>
</div>

<div class="card">
<h2>Publicar terreno</h2>
<p class="muted">Você precisa entrar para publicar.</p>
<div class="grid">
<input id="titulo" class="full" placeholder="Título">
<textarea id="descricao" class="full" placeholder="Descrição"></textarea>
<input id="preco" type="number" placeholder="Preço">
<input id="area" type="number" placeholder="Área m²">
<input id="estado" placeholder="Estado">
<input id="cidade" placeholder="Cidade">
<input id="bairro" placeholder="Bairro">
<select id="tipo"><option>Urbano</option><option>Rural</option><option>Comercial</option><option>Chácara</option><option>Sítio</option><option>Fazenda</option><option>Outro</option></select>
<select id="alcance"><option value="city">Somente esta cidade</option><option value="brazil">Todo o Brasil</option></select>
<input id="sourceUrl" placeholder="Link original (opcional)">
</div>
<p><button onclick="publishListing()">Publicar anúncio</button></p>
</div>
</div>

<div id="auth" class="hidden">
<div class="modal">
<h3 id="authTitle">Entrar</h3>
<div id="signupFields" class="hidden">
<input id="nome" placeholder="Nome completo" style="margin-bottom:8px">
<select id="role" style="margin-bottom:8px"><option value="buyer">Comprador</option><option value="seller">Vendedor</option><option value="broker">Corretor</option></select>
</div>
<input id="email" type="email" placeholder="E-mail" style="margin-bottom:8px">
<input id="senha" type="password" placeholder="Senha" style="margin-bottom:8px">
<button id="authBtn" onclick="login()" style="width:100%">Entrar</button>
<button class="alt" onclick="toggleMode()" style="width:100%;margin-top:8px">Trocar entre entrar/cadastrar</button>
<button class="alt" onclick="closeAuth()" style="width:100%;margin-top:8px">Fechar</button>
<p id="authMsg" class="muted"></p>
</div>
</div>

<script>
const sb = supabase.createClient('https://qhnslatxvfvtgvtcsiip.supabase.co','sb_publishable_ayp4DoDkVqalVBgesZ4kyQ_w6QI8hIK');
let signupMode=false,currentUser=null;

function openAuth(){document.getElementById('auth').classList.remove('hidden')}
function closeAuth(){document.getElementById('auth').classList.add('hidden')}
function toggleMode(){
 signupMode=!signupMode;
 document.getElementById('signupFields').classList.toggle('hidden',!signupMode);
 document.getElementById('authTitle').textContent=signupMode?'Criar conta':'Entrar';
 document.getElementById('authBtn').textContent=signupMode?'Criar conta':'Entrar';
 document.getElementById('authBtn').onclick=signupMode?signup:login;
}
async function refreshUser(){
 const {data}=await sb.auth.getUser(); currentUser=data.user||null;
 document.getElementById('status').textContent=currentUser?currentUser.email:'Visitante';
 document.getElementById('logout').classList.toggle('hidden',!currentUser);
}
async function login(){
 const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:senha.value});
 if(error)return authMsg.textContent=error.message;
 closeAuth();await refreshUser();
}
async function signup(){
 const {data,error}=await sb.auth.signUp({
  email:email.value.trim(),password:senha.value,
  options:{data:{full_name:nome.value.trim(),role:role.value}}
 });
 if(error)return authMsg.textContent=error.message;
 authMsg.textContent=data.session?'Conta criada e conectada.':'Conta criada. Verifique seu e-mail se a confirmação estiver ativada.';
 if(data.session){closeAuth();await refreshUser();}
}
async function logout(){await sb.auth.signOut();await refreshUser()}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function loadListings(){
 let q=sb.from('listings').select('*').eq('status','published').order('created_at',{ascending:false});
 if(fEstado.value.trim()) q=q.ilike('state',fEstado.value.trim());
 if(fCidade.value.trim()) q=q.ilike('city','%'+fCidade.value.trim()+'%');
 if(fBairro.value.trim()) q=q.ilike('neighborhood','%'+fBairro.value.trim()+'%');
 if(fTipo.value) q=q.eq('property_type',fTipo.value);
 const {data,error}=await q;
 if(error){listings.innerHTML='<p>Erro ao carregar.</p>';return}
 listings.innerHTML=data.length?data.map(x=>`<div class="card"><b>${esc(x.title)}</b><p>${Number(x.price||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</p><small>${esc(x.city)}/${esc(x.state)} • ${esc(x.neighborhood||'')}</small></div>`).join(''):'<p class="muted">Nenhum terreno encontrado.</p>';
}

async function publishListing(){
 if(!currentUser){openAuth();return}
 const payload={
  owner_id:currentUser.id,title:titulo.value.trim(),description:descricao.value.trim(),
  price:Number(preco.value||0),area_m2:Number(area.value||0),state:estado.value.trim(),
  city:cidade.value.trim(),neighborhood:bairro.value.trim(),property_type:tipo.value,
  visibility_scope:alcance.value,source_url:sourceUrl.value.trim()||null,status:'published'
 };
 if(!payload.title||!payload.state||!payload.city)return alert('Preencha título, estado e cidade.');
 const {error}=await sb.from('listings').insert(payload);
 if(error)return alert('Erro: '+error.message);
 alert('Anúncio publicado com sucesso!');
 await loadListings();
}
sb.auth.onAuthStateChange(refreshUser);
refreshUser();loadListings();
</script>
</body>
</html>
